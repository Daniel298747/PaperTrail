# PaperTrail API configuration. Every value marked ${...} can be set through the environment;
# see ../.env.example and the README for the full list.

spring:
  application:
    name: papertrail
  config:
    # Local runs pick up the repository's .env (KEY=value lines) so the same file drives Docker
    # Compose and ./mvnw. Missing files are ignored; real environment variables always win.
    import: optional:file:../.env[.properties],optional:file:.env[.properties]
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/papertrail}
    username: ${DATABASE_USERNAME:papertrail}
    password: ${DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: ${APP_UPLOAD_MAX_SIZE:10MB}
      # Slightly above the file limit to leave room for multipart framing.
      max-request-size: ${APP_UPLOAD_MAX_REQUEST_SIZE:11MB}
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  shutdown: graceful
  tomcat:
    max-swallow-size: 20MB

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

app:
  jwt:
    # Base64, >= 32 bytes. Required with the prod profile; generate with: openssl rand -base64 48
    secret: ${APP_JWT_SECRET:}
    issuer: papertrail
    access-token-ttl: ${APP_JWT_ACCESS_TTL:PT15M}
  refresh:
    ttl: ${APP_REFRESH_TTL:P30D}
    cookie-name: pt_refresh
    cookie-secure: ${APP_COOKIE_SECURE:true}
    cookie-same-site: ${APP_COOKIE_SAME_SITE:Strict}
    reuse-grace-period: PT20S
  password-hashing:
    bcrypt-strength: ${APP_BCRYPT_STRENGTH:12}
  cors:
    # Comma-separated list of browser origins allowed to call the API with credentials.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  storage:
    provider: s3
    bucket: ${S3_BUCKET:papertrail-documents}
    region: ${S3_REGION:eu-west-1}
    # Leave endpoint empty for AWS S3. For MinIO: http://localhost:9000 (or http://minio:9000 in Compose).
    endpoint: ${S3_ENDPOINT:}
    # Host browsers use to open signed URLs; defaults to endpoint.
    public-endpoint: ${S3_PUBLIC_ENDPOINT:}
    path-style-access: ${S3_PATH_STYLE_ACCESS:false}
    # Leave both empty on AWS to use the default credential chain (IAM role, profile, env).
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
    create-bucket: ${S3_CREATE_BUCKET:false}
    presign-ttl: ${S3_PRESIGN_TTL:PT5M}
  uploads:
    max-file-size: ${APP_UPLOAD_MAX_SIZE:10MB}
  jobs:
    enabled: ${APP_JOBS_ENABLED:true}
    # Spring cron (sec min hour day month weekday), evaluated in UTC.
    cron: ${APP_JOBS_CRON:0 */15 * * * *}
    horizon-days: ${APP_RECURRING_HORIZON_DAYS:30}
    run-on-startup: ${APP_JOBS_RUN_ON_STARTUP:true}
  seed:
    demo: ${APP_SEED_DEMO:false}
    exit-after-seed: ${APP_SEED_EXIT:false}
    demo-email: demo@papertrail.local
    demo-password: ${APP_DEMO_PASSWORD:paper-trail-demo}
